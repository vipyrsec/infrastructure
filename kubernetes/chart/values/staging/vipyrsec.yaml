---
ingress-nginx:
  controller:
    allowSnippetAnnotations: true
    config:
      annotations-risk-level: Critical
    service:
      # The public origin must only accept traffic from Cloudflare's edge.
      # Source: https://www.cloudflare.com/ips-v4
      loadBalancerSourceRanges:
        - 173.245.48.0/20
        - 103.21.244.0/22
        - 103.22.200.0/22
        - 103.31.4.0/22
        - 141.101.64.0/18
        - 108.162.192.0/18
        - 190.93.240.0/20
        - 188.114.96.0/20
        - 197.234.240.0/22
        - 198.41.128.0/17
        - 162.158.0.0/15
        - 104.16.0.0/13
        - 104.24.0.0/14
        - 172.64.0.0/13
        - 131.0.72.0/22

alloy:
  enabled: true
  controller:
    priorityClassName: vipyrsec-node-telemetry
  extraObjects:
    - apiVersion: scheduling.k8s.io/v1
      kind: PriorityClass
      metadata:
        name: vipyrsec-node-telemetry
      value: 1000
      globalDefault: false
      preemptionPolicy: Never
      description: Schedule node telemetry ahead of ordinary workloads without evicting running pods.

  alloy:
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        memory: 512Mi
    configMap:
      content: |-
        logging {
            level  = "info"
            format = "logfmt"
        }

        discovery.kubernetes "pods" {
            role = "pod"

            selectors {
                role  = "pod"
                field = "spec.nodeName=" + sys.env("HOSTNAME")
            }
        }

        discovery.relabel "pods" {
            targets = discovery.kubernetes.pods.targets

            rule {
                source_labels = ["__meta_kubernetes_namespace"]
                action        = "replace"
                target_label  = "namespace"
            }

            rule {
                source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
                action        = "replace"
                target_label  = "app"
            }

            rule {
                source_labels = ["__meta_kubernetes_pod_name"]
                action        = "replace"
                target_label  = "pod"
            }

            rule {
                source_labels = ["__meta_kubernetes_pod_container_name"]
                action        = "replace"
                target_label  = "container"
            }
        }

        loki.source.kubernetes "pod_logs" {
            targets    = discovery.relabel.pods.output
            forward_to = [loki.process.pod_logs.receiver]
        }

        loki.process "pod_logs" {
            stage.static_labels {
                values = {
                    cluster = "staging",
                }
            }

            forward_to = [loki.write.o11y.receiver]
        }

        loki.write "o11y" {
            endpoint {
                url = "http://loki.vipyrsec.com:30080/loki/api/v1/push"
            }
        }

        prometheus.exporter.self "local" { }

        prometheus.exporter.unix "local" { }

        remote.kubernetes.secret "postgres" {
            namespace = "postgres"
            name      = "dragonfly"
        }

        prometheus.exporter.postgres "dragonfly" {
            data_source_names = [remote.kubernetes.secret.postgres.data.dsn]
        }

        prometheus.scrape "self" {
            targets    = prometheus.exporter.self.local.targets
            forward_to = [prometheus.relabel.tagged.receiver]
        }

        prometheus.scrape "node" {
            targets    = prometheus.exporter.unix.local.targets
            forward_to = [prometheus.relabel.tagged.receiver]
        }

        prometheus.scrape "cadvisor" {
            targets           = [{"__address__" = "kubernetes.default.svc:443", "instance" = sys.env("HOSTNAME")}]
            scheme            = "https"
            metrics_path      = "/api/v1/nodes/" + sys.env("HOSTNAME") + "/proxy/metrics/cadvisor"
            bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
            honor_labels      = true
            forward_to        = [prometheus.relabel.tagged.receiver]

            tls_config {
                ca_file = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
            }
        }

        discovery.relabel "pod_metrics" {
            targets = discovery.relabel.pods.output

            rule {
                source_labels = ["__meta_kubernetes_pod_container_port_name"]
                regex         = "metrics|http-metrics|http-grafana|prometheus|envoy-metrics|hubble-metrics"
                action        = "keep"
            }

            rule {
                source_labels = ["__meta_kubernetes_pod_phase"]
                regex         = "Running"
                action        = "keep"
            }
        }

        prometheus.scrape "pods" {
            targets    = discovery.relabel.pod_metrics.output
            forward_to = [prometheus.relabel.tagged.receiver]
        }

        prometheus.scrape "postgres" {
            targets    = prometheus.exporter.postgres.dragonfly.targets
            forward_to = [prometheus.relabel.tagged.receiver]
        }

        prometheus.scrape "postgres_do" {
            scheme     = "https"
            targets    = [{"__address__" = nonsensitive(remote.kubernetes.secret.postgres.data.metrics_url)}]
            forward_to = [prometheus.relabel.tagged.receiver]

            tls_config {
                ca_pem = nonsensitive(remote.kubernetes.secret.postgres.data.metrics_ca)
            }

            basic_auth {
                username = nonsensitive(remote.kubernetes.secret.postgres.data.metrics_username)
                password = remote.kubernetes.secret.postgres.data.metrics_password
            }
        }

        prometheus.relabel "tagged" {
            rule {
                source_labels = ["__address__"]
                regex         = ".*"
                replacement   = "staging"
                target_label  = "cluster"
            }

            forward_to = [prometheus.remote_write.o11y.receiver]
        }

        prometheus.remote_write "o11y" {
            endpoint {
                url = "http://prom.vipyrsec.com:30080/api/v1/write"
            }
        }
