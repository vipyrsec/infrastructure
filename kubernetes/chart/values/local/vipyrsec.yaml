---
loki:
  enabled: true

alloy:
  enabled: true

  alloy:
    configMap:
      content: |-
        logging {
            level  = "info"
            format = "logfmt"
        }

        discovery.kubernetes "pods" {
            role = "pod"

            selectors {
                role  = "pod"
                field = "spec.nodeName=" + sys.env("HOSTNAME")
            }
        }

        discovery.relabel "pods" {
            targets = discovery.kubernetes.pods.targets

            rule {
                source_labels = ["__meta_kubernetes_namespace"]
                action        = "replace"
                target_label  = "namespace"
            }

            rule {
                source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
                action        = "replace"
                target_label  = "app"
            }

            rule {
                source_labels = ["__meta_kubernetes_pod_name"]
                action        = "replace"
                target_label  = "pod"
            }

            rule {
                source_labels = ["__meta_kubernetes_pod_container_name"]
                action        = "replace"
                target_label  = "container"
            }
        }

        loki.source.kubernetes "pod_logs" {
            targets    = discovery.relabel.pods.output
            forward_to = [loki.process.pod_logs.receiver]
        }

        loki.process "pod_logs" {
            stage.static_labels {
                values = {
                    cluster = "local",
                }
            }

            forward_to = [loki.write.o11y.receiver]
        }

        loki.write "o11y" {
            endpoint {
                url = "http://vipyrsec-loki.default.svc.cluster.local:3100/loki/api/v1/push"
            }
        }

        prometheus.exporter.self "local" { }

        prometheus.exporter.unix "local" { }

        prometheus.scrape "self" {
            targets    = prometheus.exporter.self.local.targets
            forward_to = [prometheus.relabel.tagged.receiver]
        }

        prometheus.scrape "node" {
            targets    = prometheus.exporter.unix.local.targets
            forward_to = [prometheus.relabel.tagged.receiver]
        }

        prometheus.scrape "cadvisor" {
            targets           = [{"__address__" = "kubernetes.default.svc:443", "instance" = sys.env("HOSTNAME")}]
            scheme            = "https"
            metrics_path      = "/api/v1/nodes/" + sys.env("HOSTNAME") + "/proxy/metrics/cadvisor"
            bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
            honor_labels      = true
            forward_to        = [prometheus.relabel.tagged.receiver]

            tls_config {
                ca_file = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
            }
        }

        discovery.relabel "pod_metrics" {
            targets = discovery.relabel.pods.output

            rule {
                source_labels = ["__meta_kubernetes_pod_container_port_name"]
                regex         = "metrics|http-metrics|http-grafana|prometheus|envoy-metrics|hubble-metrics"
                action        = "keep"
            }

            rule {
                source_labels = ["__meta_kubernetes_pod_phase"]
                regex         = "Running"
                action        = "keep"
            }
        }

        prometheus.scrape "pods" {
            targets    = discovery.relabel.pod_metrics.output
            forward_to = [prometheus.relabel.tagged.receiver]
        }

        prometheus.relabel "tagged" {
            rule {
                source_labels = ["__address__"]
                regex         = ".*"
                replacement   = "local"
                target_label  = "cluster"
            }

            forward_to = [prometheus.remote_write.o11y.receiver]
        }

        prometheus.remote_write "o11y" {
            endpoint {
                url = "http://prometheus.prometheus.svc.cluster.local:9090/api/v1/write"
            }
        }
