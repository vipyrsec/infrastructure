---
apiVersion: apps/v1
kind: Deployment

metadata:
  namespace: dragonfly
  name: mainframe

spec:
  replicas: 1
  selector:
    matchLabels:
      app: mainframe
  template:
    metadata:
      labels:
        app: mainframe
    spec:
      containers:
        - name: mainframe
          image: ghcr.io/vipyrsec/dragonfly-mainframe:sha-af5e201750602f68d51d79dd6ad0c0cc109144d7
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: dragonfly-mainframe-env
            - configMapRef:
                name: dragonfly-mainframe-opengrep-shadow
                optional: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 10000
            runAsGroup: 10000
            readOnlyRootFilesystem: true
          ports:
            - containerPort: 8000
