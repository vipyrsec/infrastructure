---
apiVersion: apps/v1
kind: Deployment

metadata:
  namespace: dragonfly
  name: mainframe

spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: mainframe
  template:
    metadata:
      labels:
        app: mainframe
    spec:
      containers:
        - name: mainframe
          image: ghcr.io/vipyrsec/dragonfly-mainframe:sha-1891911cc292e8b6117b5d3ad41d8876a3d248ac@sha256:86a1e77676043b6495d1930bd08c5b93aff5a79c90493472da5070a03e65c865
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 512Mi
          envFrom:
            - secretRef:
                name: dragonfly-mainframe-env
            - configMapRef:
                name: dragonfly-mainframe-opengrep-shadow
                optional: true
            - configMapRef:
                name: dragonfly-mainframe-scan-cache
                optional: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 10000
            runAsGroup: 10000
            readOnlyRootFilesystem: true
          startupProbe:
            httpGet:
              path: /
              port: http-metrics
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /
              port: http-metrics
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          ports:
            - name: http-metrics
              containerPort: 8000
