---
apiVersion: v1
kind: ConfigMap

metadata:
  name: grafana-alerting-staging
  namespace: grafana

data:
  dragonfly-staging.yaml: |-
    apiVersion: 1

    contactPoints:
      - orgId: 1
        name: discord-staging-alerts
        receivers:
          - uid: discord-staging-alerts
            type: discord
            disableResolveMessage: false
            settings:
              url: $GF_ALERTING_DISCORD_WEBHOOK_URL
              use_discord_username: false
              title: 'VIPYR — STAGING — {{ .Status | toUpper }}'
              message: |
                {{- $$body := "" -}}
                {{- $$omitted := false -}}
                {{- range .Alerts -}}
                  {{- $$reason := index .Annotations "grafana_state_reason" -}}
                  {{- $$summary := or .Annotations.summary .Labels.alertname "Monitoring alert" -}}
                  {{- if and (eq .Status "resolved") (not $$reason) .Annotations.resolved_summary -}}
                    {{- $$summary = .Annotations.resolved_summary -}}
                  {{- end -}}
                  {{- $$entry := printf "**%s — %.120s**\n" (toUpper .Status) $$summary -}}
                  {{- $$entry = printf "%s%s · %.60s" $$entry
                      (toUpper .Labels.environment) (or .Labels.service "monitoring") -}}
                  {{- with .Labels.severity }}{{ $$entry = printf "%s · %.20s" $$entry . }}{{ end -}}
                  {{- with .Labels.instance }}{{ $$entry = printf "%s · %.100s" $$entry . }}{{ end -}}
                  {{- $$entry = printf "%s\n" $$entry -}}
                  {{- if $$reason -}}
                    {{- $$entry = printf "%sState reason: %.100s. Verify the alert before assuming recovery.\n"
                        $$entry $$reason -}}
                  {{- else -}}
                    {{- with .Annotations.description -}}
                      {{- $$entry = printf "%sLast evaluation: %.250s\n" $$entry . -}}
                    {{- end -}}
                  {{- end -}}
                  {{- if eq .Status "firing" -}}
                    {{- with .Annotations.threshold }}{{ $$entry = printf "%sTrigger: %.150s\n" $$entry . }}{{ end -}}
                    {{- $$action := or .Annotations.action
                        "Inspect the alert query and data source for missing telemetry or errors." -}}
                    {{- $$entry = printf "%sCheck: %.220s\n" $$entry $$action -}}
                  {{- end -}}
                  {{- with .Annotations.Error }}{{ $$entry = printf "%sEvaluation error: %.400s\n"
                      $$entry . }}{{ end -}}
                  {{- $$entry = printf "%sStarted: %s" $$entry (.StartsAt.UTC.Format "2006-01-02 15:04 UTC") -}}
                  {{- if eq .Status "resolved" -}}
                    {{- $$entry = printf "%s · Ended: %s" $$entry (.EndsAt.UTC.Format "2006-01-02 15:04 UTC") -}}
                  {{- end -}}
                  {{- with .GeneratorURL }}{{ $$entry = printf "%s\n[View alert](%s)" $$entry . }}{{ end -}}
                  {{- $$candidate := printf "%s%s\n\n" $$body $$entry -}}
                  {{- if le (len $$candidate) 1750 -}}
                    {{- $$body = $$candidate -}}
                  {{- else -}}
                    {{- $$omitted = true -}}
                  {{- end -}}
                {{- end -}}
                {{ len .Alerts.Firing }} firing · {{ len .Alerts.Resolved }} resolved
                {{ $$body -}}
                {{- if $$omitted -}}
                Some alerts omitted to fit Discord. [View all alerts](https://grafana.vipyrsec.com/alerting/list)
                {{- end -}}

    groups:
      - orgId: 1
        name: dragonfly-staging
        folder: Dragonfly Alerts
        interval: 1m
        rules:
          - uid: dragonfly-staging-deadletters
            title: '[STAGING] Dead-letter growth above baseline'
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 1800
                  to: 0
                datasourceUid: bdw7z1jhaby80e
                model:
                  editorMode: code
                  expr: >-
                    sum by (cluster) (
                      increase(
                        packages_dead_lettered_total{
                          cluster="staging",
                          namespace="dragonfly",
                          container="mainframe"
                        }[30m]
                      )
                    )
                  instant: true
                  intervalMs: 1000
                  maxDataPoints: 43200
                  range: false
                  refId: A
              - refId: B
                relativeTimeRange:
                  from: 604800
                  to: 0
                datasourceUid: bdw7z1jhaby80e
                model:
                  editorMode: code
                  expr: >-
                    avg_over_time(
                      (
                        sum by (cluster) (
                          increase(
                            packages_dead_lettered_total{
                              cluster="staging",
                              namespace="dragonfly",
                              container="mainframe"
                            }[30m]
                          )
                        )
                      )[7d:30m]
                    )
                  instant: true
                  intervalMs: 1000
                  maxDataPoints: 43200
                  range: false
                  refId: B
              - refId: C
                relativeTimeRange:
                  from: 0
                  to: 0
                datasourceUid: __expr__
                model:
                  conditions:
                    - evaluator:
                        params:
                          - 0
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                          - C
                      reducer:
                        params: []
                        type: last
                      type: query
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: '$A >= 2 && $A > 3 * $B'
                  intervalMs: 1000
                  maxDataPoints: 43200
                  refId: C
                  type: math
            noDataState: Alerting
            execErrState: Alerting
            for: 5m
            annotations:
              summary: >-
                Dead-lettering above normal
              resolved_summary: >-
                Dead-letter alert cleared
              description: >-
                {{ printf "%.1f" $values.A.Value }} dead-lettered packages / 30 min; seven-day average
                {{ printf "%.1f" $values.B.Value }}.
              threshold: >-
                At least 2 packages and more than 3× baseline for 5 min.
              action: >-
                Inspect mainframe dead-letter reasons and scanner retries; identify affected packages before
                replaying.
            labels:
              environment: staging
              service: dragonfly-mainframe
              severity: critical
            isPaused: false
            notification_settings:
              receiver: discord-staging-alerts

          - uid: dragonfly-staging-failures
            title: '[STAGING] Failed-package growth above baseline'
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 900
                  to: 0
                datasourceUid: bdw7z1jhaby80e
                model:
                  editorMode: code
                  expr: >-
                    sum by (cluster) (
                      increase(
                        packages_fail_total{
                          cluster="staging",
                          namespace="dragonfly",
                          container="mainframe"
                        }[15m]
                      )
                    )
                  instant: true
                  intervalMs: 1000
                  maxDataPoints: 43200
                  range: false
                  refId: A
              - refId: B
                relativeTimeRange:
                  from: 604800
                  to: 0
                datasourceUid: bdw7z1jhaby80e
                model:
                  editorMode: code
                  expr: >-
                    avg_over_time(
                      (
                        sum by (cluster) (
                          increase(
                            packages_fail_total{
                              cluster="staging",
                              namespace="dragonfly",
                              container="mainframe"
                            }[15m]
                          )
                        )
                      )[7d:15m]
                    )
                  instant: true
                  intervalMs: 1000
                  maxDataPoints: 43200
                  range: false
                  refId: B
              - refId: C
                relativeTimeRange:
                  from: 0
                  to: 0
                datasourceUid: __expr__
                model:
                  conditions:
                    - evaluator:
                        params:
                          - 0
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                          - C
                      reducer:
                        params: []
                        type: last
                      type: query
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: '$A >= 10 && $A > 3 * $B'
                  intervalMs: 1000
                  maxDataPoints: 43200
                  refId: C
                  type: math
            noDataState: Alerting
            execErrState: Alerting
            for: 10m
            annotations:
              summary: >-
                Package failures above normal
              resolved_summary: >-
                Package-failure alert cleared
              description: >-
                {{ printf "%.1f" $values.A.Value }} failed packages / 15 min; seven-day average
                {{ printf "%.1f" $values.B.Value }}.
              threshold: >-
                At least 10 failures and more than 3× baseline for 10 min.
              action: >-
                Inspect scanner failure reasons. Separate configured archive limits from scanner crashes or API
                errors.
            labels:
              environment: staging
              service: dragonfly-mainframe
              severity: warning
            isPaused: false
            notification_settings:
              receiver: discord-staging-alerts

          - uid: dragonfly-staging-queue-pressure
            title: '[STAGING] Queue pressure rising above baseline'
            condition: D
            data:
              - refId: A
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: bdw7z1jhaby80e
                model:
                  editorMode: code
                  expr: >-
                    max by (cluster) (
                      packages_in_queue{
                        cluster="staging",
                        namespace="dragonfly",
                        container="mainframe"
                      }
                    )
                  instant: true
                  intervalMs: 1000
                  maxDataPoints: 43200
                  range: false
                  refId: A
              - refId: B
                relativeTimeRange:
                  from: 604800
                  to: 0
                datasourceUid: bdw7z1jhaby80e
                model:
                  editorMode: code
                  expr: >-
                    max by (cluster) (
                      avg_over_time(
                        packages_in_queue{
                          cluster="staging",
                          namespace="dragonfly",
                          container="mainframe"
                        }[7d]
                      )
                    )
                  instant: true
                  intervalMs: 1000
                  maxDataPoints: 43200
                  range: false
                  refId: B
              - refId: C
                relativeTimeRange:
                  from: 1800
                  to: 0
                datasourceUid: bdw7z1jhaby80e
                model:
                  editorMode: code
                  expr: >-
                    max by (cluster) (
                      packages_in_queue{
                        cluster="staging",
                        namespace="dragonfly",
                        container="mainframe"
                      } offset 30m
                    )
                  instant: true
                  intervalMs: 1000
                  maxDataPoints: 43200
                  range: false
                  refId: C
              - refId: D
                relativeTimeRange:
                  from: 0
                  to: 0
                datasourceUid: __expr__
                model:
                  conditions:
                    - evaluator:
                        params:
                          - 0
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                          - D
                      reducer:
                        params: []
                        type: last
                      type: query
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: '$A >= 100 && $A > 3 * $B && $A - $C >= 50'
                  intervalMs: 1000
                  maxDataPoints: 43200
                  refId: D
                  type: math
            noDataState: Alerting
            execErrState: Alerting
            for: 10m
            annotations:
              summary: >-
                Queue pressure high and rising
              resolved_summary: >-
                Queue-pressure alert cleared
              description: >-
                {{ printf "%.0f" $values.A.Value }} packages queued; seven-day average
                {{ printf "%.1f" $values.B.Value }}; {{ printf "%.0f" $values.C.Value }} queued 30 min ago.
              threshold: >-
                At least 100 queued, more than 3× baseline, and growth of at least 50 over 30 min, sustained for
                10 min.
              action: >-
                Check scanner availability, processing failures, and mainframe queue throughput.
            labels:
              environment: staging
              service: dragonfly-mainframe
              severity: critical
            isPaused: false
            notification_settings:
              receiver: discord-staging-alerts

          - uid: dragonfly-staging-no-activity
            title: '[STAGING] No package activity'
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: bdw7z1jhaby80e
                model:
                  editorMode: code
                  expr: >-
                    sum by (cluster) (
                      increase(
                        packages_ingested_total{
                          cluster="staging",
                          namespace="dragonfly",
                          container="mainframe"
                        }[10m]
                      )
                    )
                  instant: true
                  intervalMs: 1000
                  maxDataPoints: 43200
                  range: false
                  refId: A
              - refId: B
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: bdw7z1jhaby80e
                model:
                  editorMode: code
                  expr: >-
                    sum by (cluster) (
                      increase(
                        packages_success_total{
                          cluster="staging",
                          namespace="dragonfly",
                          container="mainframe"
                        }[10m]
                      )
                    )
                  instant: true
                  intervalMs: 1000
                  maxDataPoints: 43200
                  range: false
                  refId: B
              - refId: C
                relativeTimeRange:
                  from: 0
                  to: 0
                datasourceUid: __expr__
                model:
                  conditions:
                    - evaluator:
                        params:
                          - 0
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                          - C
                      reducer:
                        params: []
                        type: last
                      type: query
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: '$A < 1 && $B < 1'
                  intervalMs: 1000
                  maxDataPoints: 43200
                  refId: C
                  type: math
            noDataState: Alerting
            execErrState: Alerting
            for: 2m
            annotations:
              summary: >-
                No package activity
              resolved_summary: >-
                Package activity resumed
              description: >-
                {{ printf "%.1f" $values.A.Value }} packages ingested and {{ printf "%.1f" $values.B.Value }}
                successful scans / 10 min.
              threshold: >-
                Both ingestion and successful scans below 1 over 10 min, sustained for 2 min.
              action: >-
                Check loader runs, mainframe health, scanner connectivity, and upstream package availability.
            labels:
              environment: staging
              service: dragonfly-mainframe
              severity: critical
            isPaused: false
            notification_settings:
              receiver: discord-staging-alerts

          - uid: node-staging-memory
            title: '[STAGING] Node memory headroom below 10%'
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: bdw7z1jhaby80e
                model:
                  editorMode: code
                  expr: >-
                    node_memory_MemAvailable_bytes{cluster="staging"}
                    / node_memory_MemTotal_bytes{cluster="staging"}
                  instant: true
                  intervalMs: 1000
                  maxDataPoints: 43200
                  range: false
                  refId: A
              - refId: C
                relativeTimeRange:
                  from: 0
                  to: 0
                datasourceUid: __expr__
                model:
                  conditions:
                    - evaluator:
                        params:
                          - 0
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                          - C
                      reducer:
                        params: []
                        type: last
                      type: query
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: $A < 0.1
                  intervalMs: 1000
                  maxDataPoints: 43200
                  refId: C
                  type: math
            noDataState: Alerting
            execErrState: Alerting
            for: 5m
            annotations:
              summary: >-
                Low node memory headroom
              resolved_summary: >-
                Node memory headroom recovered
              description: >-
                {{ humanizePercentage $values.A.Value }} memory available on {{ $labels.instance }}.
              threshold: >-
                Available memory below 10% for 5 min.
              action: >-
                Inspect container working sets, reclaim pressure, and workload placement before increasing
                concurrency.
            labels:
              environment: staging
              service: kubernetes
              severity: critical
            isPaused: false
            notification_settings:
              receiver: discord-staging-alerts
          - uid: node-staging-memory-stalls
            title: '[STAGING] Node memory stalls above 10%'
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: bdw7z1jhaby80e
                model:
                  editorMode: code
                  expr: rate(node_pressure_memory_waiting_seconds_total{cluster="staging"}[5m])
                  instant: true
                  intervalMs: 1000
                  maxDataPoints: 43200
                  range: false
                  refId: A
              - refId: C
                relativeTimeRange:
                  from: 0
                  to: 0
                datasourceUid: __expr__
                model:
                  conditions:
                    - evaluator:
                        params:
                          - 0
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                          - C
                      reducer:
                        params: []
                        type: last
                      type: query
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: $A > 0.1
                  intervalMs: 1000
                  maxDataPoints: 43200
                  refId: C
                  type: math
            noDataState: Alerting
            execErrState: Alerting
            for: 5m
            annotations:
              summary: >-
                High node memory stalls
              resolved_summary: >-
                Node memory stalls recovered
              description: >-
                {{ humanizePercentage $values.A.Value }} of time stalled on memory on {{ $labels.instance }} (5
                min rate).
              threshold: >-
                Memory stalls above 10% for 5 min.
              action: >-
                Inspect file-cache refaults, container working sets, and workload placement.
            labels:
              environment: staging
              service: kubernetes
              severity: critical
            isPaused: false
            notification_settings:
              receiver: discord-staging-alerts
          - uid: node-staging-node-telemetry
            title: '[STAGING] Node metrics missing'
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: bdw7z1jhaby80e
                model:
                  editorMode: code
                  expr: count(up{cluster="staging",job="integrations/unix"} == 1) or vector(0)
                  instant: true
                  intervalMs: 1000
                  maxDataPoints: 43200
                  range: false
                  refId: A
              - refId: C
                relativeTimeRange:
                  from: 0
                  to: 0
                datasourceUid: __expr__
                model:
                  conditions:
                    - evaluator:
                        params:
                          - 0
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                          - C
                      reducer:
                        params: []
                        type: last
                      type: query
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: $A < 3
                  intervalMs: 1000
                  maxDataPoints: 43200
                  refId: C
                  type: math
            noDataState: Alerting
            execErrState: Alerting
            for: 5m
            annotations:
              summary: >-
                Node metrics missing
              resolved_summary: >-
                Node metrics restored
              description: >-
                {{ printf "%.0f" $values.A.Value }}/3 workers reporting healthy node metrics.
              threshold: >-
                Fewer than 3 healthy node telemetry targets for 5 min.
              action: >-
                Check Alloy pods, node readiness, and the integrations/unix scrape targets. Missing metrics do not
                mean zero usage.
            labels:
              environment: staging
              service: kubernetes
              severity: critical
            isPaused: false
            notification_settings:
              receiver: discord-staging-alerts
          - uid: node-staging-container-telemetry
            title: '[STAGING] Container metrics missing'
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: bdw7z1jhaby80e
                model:
                  editorMode: code
                  expr: count(up{cluster="staging",job="prometheus.scrape.cadvisor"} == 1) or vector(0)
                  instant: true
                  intervalMs: 1000
                  maxDataPoints: 43200
                  range: false
                  refId: A
              - refId: C
                relativeTimeRange:
                  from: 0
                  to: 0
                datasourceUid: __expr__
                model:
                  conditions:
                    - evaluator:
                        params:
                          - 0
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                          - C
                      reducer:
                        params: []
                        type: last
                      type: query
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: $A < 3
                  intervalMs: 1000
                  maxDataPoints: 43200
                  refId: C
                  type: math
            noDataState: Alerting
            execErrState: Alerting
            for: 5m
            annotations:
              summary: >-
                Container metrics missing
              resolved_summary: >-
                Container metrics restored
              description: >-
                {{ printf "%.0f" $values.A.Value }}/3 workers reporting healthy container metrics.
              threshold: >-
                Fewer than 3 healthy cAdvisor telemetry targets for 5 min.
              action: >-
                Check Alloy pods, kubelet proxy authorization, and prometheus.scrape.cadvisor targets. Missing
                metrics do not mean zero usage.
            labels:
              environment: staging
              service: kubernetes
              severity: critical
            isPaused: false
            notification_settings:
              receiver: discord-staging-alerts
