---
# yamllint disable rule:line-length
apiVersion: v1
kind: ConfigMap

metadata:
  name: grafana-dashboard-provider
  namespace: grafana

data:
  dragonfly.yaml: |
    apiVersion: 1

    providers:
      - name: dragonfly
        orgId: 1
        folder: Dragonfly
        folderUid: dragonfly
        type: file
        disableDeletion: true
        updateIntervalSeconds: 30
        allowUiUpdates: false
        options:
          path: /etc/grafana/dashboards/dragonfly
          foldersFromFilesStructure: false

---
apiVersion: v1
kind: ConfigMap

metadata:
  name: grafana-dashboard-queue-pressure
  namespace: grafana

data:
  queue-pressure.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "description": "Dragonfly queue pressure, throughput, and snapshot health by cluster.",
      "editable": false,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "Packages available for a scanner, including retryable leases.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
