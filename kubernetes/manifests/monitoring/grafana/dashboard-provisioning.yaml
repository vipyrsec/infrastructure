          "pluginVersion": "12.3.1",
          "targets": [
            {
              "editorMode": "code",
              "expr": "sum by(cluster)(packages_queue{cluster=~\"$cluster\",state=~\"queued|retryable\"})",
              "legendFormat": "{{cluster}} / runnable",
              "range": true,
              "refId": "A"
