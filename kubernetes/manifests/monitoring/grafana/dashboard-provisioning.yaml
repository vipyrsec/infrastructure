            {
              "editorMode": "code",
              "expr": "sum by(cluster)(packages_queue{cluster=~\"$cluster\",state=\"in_progress\"})",
              "legendFormat": "{{cluster}} / in progress",
              "range": true,
              "refId": "B"
            }
          ],
