          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "Ingestion and scan outcomes over a five-minute window.",
          "fieldConfig": {
            "defaults": {
              "unit": "ops"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 12
          },
          "id": 9,
          "options": {
            "legend": {
              "calcs": [
                "lastNotNull"
              ],
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "hideZeros": false,
              "mode": "multi",
              "sort": "desc"
            }
          },
          "pluginVersion": "12.3.1",
          "targets": [
            {
              "editorMode": "code",
              "expr": "sum by(cluster)(rate(packages_ingested_total{cluster=~\"$cluster\"}[5m]))",
              "legendFormat": "{{cluster}} / ingested",
              "range": true,
              "refId": "A"
            },
            {
              "editorMode": "code",
              "expr": "sum by(cluster)(rate(packages_success_total{cluster=~\"$cluster\"}[5m]))",
              "legendFormat": "{{cluster}} / success",
              "range": true,
              "refId": "B"
            },
            {
              "editorMode": "code",
              "expr": "sum by(cluster)(rate(packages_fail_total{cluster=~\"$cluster\"}[5m]))",
              "legendFormat": "{{cluster}} / failed",
              "range": true,
              "refId": "C"
            }
          ],
          "title": "Package Throughput",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "Snapshot staleness and refresh failures. Staleness should remain below 120 seconds.",
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byFrameRefID",
                  "options": "B"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "short"
                  }
                ]
              }
            ]
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 12
          },
          "id": 10,
          "options": {
            "legend": {
              "calcs": [
                "lastNotNull"
              ],
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "hideZeros": false,
              "mode": "multi",
              "sort": "desc"
            }
          },
          "pluginVersion": "12.3.1",
          "targets": [
            {
              "editorMode": "code",
              "expr": "time()-max by(cluster)(packages_queue_snapshot_timestamp_seconds{cluster=~\"$cluster\"})",
              "legendFormat": "{{cluster}} / snapshot age",
              "range": true,
              "refId": "A"
            },
            {
              "editorMode": "code",
              "expr": "sum by(cluster)(increase(packages_queue_refresh_failures_total{cluster=~\"$cluster\"}[15m]))",
              "legendFormat": "{{cluster}} / failures",
              "range": true,
              "refId": "B"
            }
          ],
          "title": "Queue Snapshot Health",
          "type": "timeseries"
        }
      ],
      "refresh": "30s",
      "schemaVersion": 41,
      "tags": [
        "dragonfly",
        "queue",
        "provisioned"
      ],
      "templating": {
        "list": [
          {
            "current": {},
            "hide": 0,
            "includeAll": false,
            "label": "Prometheus",
            "multi": false,
            "name": "DS_PROMETHEUS",
            "options": [],
            "query": "prometheus",
            "refresh": 1,
            "regex": "",
            "type": "datasource"
          },
          {
            "allValue": ".*",
            "current": {
              "selected": true,
              "text": [
                "All"
              ],
              "value": [
                "$__all"
              ]
            },
            "datasource": {
              "type": "prometheus",
              "uid": "${DS_PROMETHEUS}"
            },
            "definition": "label_values(packages_queue, cluster)",
            "hide": 0,
            "includeAll": true,
            "label": "Cluster",
            "multi": true,
            "name": "cluster",
            "options": [],
            "query": {
              "query": "label_values(packages_queue, cluster)",
              "refId": "PrometheusVariableQueryEditor-VariableQuery"
            },
            "refresh": 1,
            "regex": "",
            "sort": 1,
            "type": "query"
          }
        ]
      },
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "timepicker": {},
      "timezone": "browser",
      "title": "Dragonfly Queue Pressure",
      "uid": "dragonfly-queue-pressure",
      "version": 1,
      "weekStart": ""
    }

