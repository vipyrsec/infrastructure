            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showPercentChange": false,
            "textMode": "auto",
            "wideLayout": true
          },
          "pluginVersion": "12.3.1",
          "targets": [
            {
              "editorMode": "code",
              "expr": "sum(packages_queue{cluster=~\"$cluster\",state=~\"queued|retryable\"}) / clamp_min(sum(rate(packages_success_total{cluster=~\"$cluster\"}[5m])),0.001)",
              "instant": true,
              "legendFormat": "drain time",
              "range": false,
              "refId": "A"
            }
          ],
          "title": "Estimated Drain Time",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
