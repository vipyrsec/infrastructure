---
apiVersion: apps/v1
kind: Deployment

metadata:
  namespace: discord
  name: bot

spec:
  replicas: 1
  selector:
    matchLabels:
      app: bot
  template:
    metadata:
      labels:
        app: bot
    spec:
      containers:
        - name: bot
          image: ghcr.io/vipyrsec/bot:sha-ac5d794421cc117a2a63b5fa2cf46b3510d2d23d
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: bot-env
            - configMapRef:
                name: dragonfly-bot-opengrep-shadow
                optional: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 10000
            runAsGroup: 10000
            readOnlyRootFilesystem: true
